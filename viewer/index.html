<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>img2babylon viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1e24; }
    #app { width: 100%; height: 100%; display: block; touch-action: none; }
    .harness-bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 10; }
    .harness-bar button { padding: 6px 12px; border: 0; border-radius: 6px; background: #3b4252;
      color: #eceff4; font: 13px/1 system-ui; cursor: pointer; }
    .harness-bar button:hover { background: #4c566a; }
    .error-banner { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; background: #bf3131;
      color: #fff; font: 14px/1.4 system-ui; z-index: 20; }
    .actuator-panel { position: fixed; top: 10px; right: 10px; width: 230px; max-height: calc(100% - 20px);
      overflow-y: auto; background: #2e3440cc; border-radius: 8px; padding: 10px; z-index: 10;
      font: 12px/1.5 system-ui; color: #eceff4; }
    .actuator-panel h3 { margin: 0 0 6px; font-size: 13px; }
    .actuator-row { display: grid; grid-template-columns: 1fr 40px; align-items: center; gap: 4px;
      margin-bottom: 4px; }
    .actuator-row label { grid-column: 1 / 3; color: #d8dee9; }
    .actuator-row input[type="range"] { width: 100%; }
    .actuator-row .val { text-align: right; color: #88c0d0; font-variant-numeric: tabular-nums; }
    .actuator-panel .reset { margin-top: 6px; width: 100%; padding: 5px 0; border: 0; border-radius: 6px;
      background: #3b4252; color: #eceff4; cursor: pointer; }
    .actuator-panel .reset:hover { background: #4c566a; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
